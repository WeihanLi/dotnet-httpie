name: Markdown Link Check

on:
  push:
    branches:
      - "main"
      - "dev"
    paths:
      - "**/*.md"
  pull_request:
    branches:
      - "dev"
    paths:
      - "**/*.md"

jobs:
  check-links:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: "yes"
          use-verbose-mode: "yes"
          check-modified-files-only: "yes"
          base-branch: "dev"
